<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="strategos — agentic trading orchestrator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="namegrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <ellipse cx="970" cy="160" rx="380" ry="220" fill="url(#glow)"/>

  <!-- LEFT -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, system-ui, sans-serif">
    <g transform="translate(60, 80)">
      <rect width="64" height="64" rx="12" fill="none" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="2"/>
      <text x="32" y="46" font-size="32" font-weight="800" fill="url(#namegrad)" text-anchor="middle" letter-spacing="-0.5">σ</text>
      <path d="M 0 8 L 0 0 L 8 0" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <path d="M 56 0 L 64 0 L 64 8" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <path d="M 64 56 L 64 64 L 56 64" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <path d="M 8 64 L 0 64 L 0 56" fill="none" stroke="#22d3ee" stroke-width="2"/>
    </g>

    <text x="148" y="118" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#64748b" letter-spacing="2.5">~/strategos $ orchestrate --mode=live</text>

    <text x="60" y="180" font-size="68" font-weight="800" fill="url(#namegrad)" letter-spacing="-2.5" filter="url(#neon)">
      strategos
    </text>

    <text x="60" y="216" font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="0.3">
      The boss layer. Multi-agent ensemble. Risk-gated. Audit-logged.
    </text>

    <g transform="translate(60, 240)" font-family="ui-monospace, Consolas, monospace">
      <g><rect width="68" height="28" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.55"/><text x="34" y="19" font-size="11" font-weight="700" fill="#22d3ee" text-anchor="middle">AGENTS</text></g>
      <g transform="translate(80, 0)"><rect width="60" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.55"/><text x="30" y="19" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">GATES</text></g>
      <g transform="translate(152, 0)"><rect width="64" height="28" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.55"/><text x="32" y="19" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">ALLOC</text></g>
      <g transform="translate(228, 0)"><rect width="60" height="28" rx="14" fill="#0f172a" stroke="#f0abfc" stroke-opacity="0.55"/><text x="30" y="19" font-size="11" font-weight="700" fill="#f0abfc" text-anchor="middle">AUDIT</text></g>
      <g transform="translate(300, 0)"><rect width="60" height="28" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.55"/><text x="30" y="19" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">LLM</text></g>
    </g>

    <text x="60" y="304" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#475569" letter-spacing="2.4">
      MIT  ·  ANTHROPIC · OPENAI · OLLAMA  ·  HMAC AUDIT CHAIN
    </text>
  </g>

  <!-- RIGHT: pipeline diagram. agents → ensemble → alloc → gates → exec -->
  <g transform="translate(700, 50)">
    <rect x="0" y="0" width="540" height="240" rx="10" fill="#070a14" stroke="#1e293b"/>
    <rect x="0" y="0" width="540" height="26" rx="10" fill="#0f172a"/>
    <rect x="0" y="18" width="540" height="8" fill="#0f172a"/>
    <g font-family="ui-monospace, Consolas, monospace" font-size="10">
      <circle cx="14" cy="13" r="3.5" fill="#ef4444"/>
      <circle cx="26" cy="13" r="3.5" fill="#fbbf24"/>
      <circle cx="38" cy="13" r="3.5" fill="#22d3ee"/>
      <text x="56" y="17" fill="#64748b">orchestrator.step()</text>
      <rect x="438" y="5" width="92" height="16" rx="8" fill="#1a0a1f" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text x="484" y="16" fill="#a78bfa" text-anchor="middle">AUDIT INTACT</text>
    </g>

    <!-- AGENT INPUTS (left column) -->
    <g font-family="ui-monospace, Consolas, monospace" font-size="9">
      <g transform="translate(20, 50)">
        <circle cx="0" cy="0" r="12" fill="#0a0e1f" stroke="#22d3ee"/>
        <text x="0" y="3" fill="#22d3ee" text-anchor="middle" font-size="9" font-weight="700">A1</text>
      </g>
      <g transform="translate(20, 95)">
        <circle cx="0" cy="0" r="12" fill="#0a0e1f" stroke="#38bdf8"/>
        <text x="0" y="3" fill="#38bdf8" text-anchor="middle" font-size="9" font-weight="700">A2</text>
      </g>
      <g transform="translate(20, 140)">
        <circle cx="0" cy="0" r="12" fill="#0a0e1f" stroke="#a78bfa"/>
        <text x="0" y="3" fill="#a78bfa" text-anchor="middle" font-size="9" font-weight="700">RL</text>
      </g>

      <text x="20" y="180" fill="#64748b" text-anchor="middle">agents</text>
    </g>

    <!-- Connecting flow lines from agents to ensemble -->
    <g fill="none" stroke="url(#flow)" stroke-width="1.5" opacity="0.85">
      <path d="M 32 50 Q 90 50 130 95"/>
      <path d="M 32 95 Q 90 95 130 95"/>
      <path d="M 32 140 Q 90 140 130 95"/>
    </g>

    <!-- ENSEMBLE box -->
    <g transform="translate(140, 75)">
      <rect width="80" height="44" rx="6" fill="#0a0e1f" stroke="#a78bfa" stroke-opacity="0.7"/>
      <text x="40" y="17" font-family="ui-monospace, Consolas, monospace" font-size="8" fill="#64748b" text-anchor="middle" letter-spacing="1.5">ENSEMBLE</text>
      <text x="40" y="34" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">vote / weight</text>
    </g>

    <!-- arrow ensemble → alloc -->
    <g fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.9">
      <path d="M 220 97 L 250 97" stroke-linecap="round"/>
      <polygon points="250,93 258,97 250,101" fill="#a78bfa"/>
    </g>

    <!-- ALLOC box -->
    <g transform="translate(258, 75)">
      <rect width="80" height="44" rx="6" fill="#0a0e1f" stroke="#38bdf8" stroke-opacity="0.7"/>
      <text x="40" y="17" font-family="ui-monospace, Consolas, monospace" font-size="8" fill="#64748b" text-anchor="middle" letter-spacing="1.5">ALLOCATOR</text>
      <text x="40" y="34" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">capital w/</text>
    </g>

    <g fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.9">
      <path d="M 338 97 L 368 97" stroke-linecap="round"/>
      <polygon points="368,93 376,97 368,101" fill="#38bdf8"/>
    </g>

    <!-- RISK GATE chain -->
    <g transform="translate(376, 60)" font-family="ui-monospace, Consolas, monospace" font-size="8">
      <rect width="80" height="74" rx="6" fill="#0a0e1f" stroke="#22d3ee" stroke-opacity="0.7"/>
      <text x="40" y="14" fill="#64748b" text-anchor="middle" letter-spacing="1.5">GATES</text>
      <g fill="#22d3ee" text-anchor="middle" font-weight="700">
        <text x="40" y="30">limit</text>
        <text x="40" y="44">exposure</text>
        <text x="40" y="58">drawdown</text>
        <text x="40" y="72">kill ↯</text>
      </g>
    </g>

    <g fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.9">
      <path d="M 456 97 L 488 97" stroke-linecap="round"/>
      <polygon points="488,93 496,97 488,101" fill="#22d3ee"/>
    </g>

    <!-- EXECUTION dot -->
    <g transform="translate(508, 97)">
      <circle r="14" fill="#0a0e1f" stroke="#22d3ee" stroke-width="2"/>
      <circle r="6" fill="#22d3ee">
        <animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="34" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#22d3ee" text-anchor="middle" font-weight="700">EXEC</text>
    </g>

    <!-- AUDIT LOG row beneath -->
    <g transform="translate(20, 170)" font-family="ui-monospace, Consolas, monospace">
      <text x="0" y="-2" font-size="8" fill="#64748b" letter-spacing="1.5">AUDIT // hmac-sha256 chain</text>
      <g fill="#a78bfa">
        <rect x="0" y="6" width="24" height="3" rx="1" opacity="0.85"/>
        <rect x="30" y="6" width="40" height="3" rx="1" opacity="0.7"/>
        <rect x="76" y="6" width="20" height="3" rx="1" opacity="0.85"/>
        <rect x="102" y="6" width="56" height="3" rx="1" opacity="0.6"/>
        <rect x="164" y="6" width="32" height="3" rx="1" opacity="0.8"/>
        <rect x="202" y="6" width="44" height="3" rx="1" opacity="0.7"/>
        <rect x="252" y="6" width="28" height="3" rx="1" opacity="0.85"/>
        <rect x="286" y="6" width="64" height="3" rx="1" opacity="0.65"/>
        <rect x="356" y="6" width="20" height="3" rx="1" opacity="0.85"/>
        <rect x="382" y="6" width="48" height="3" rx="1" opacity="0.7"/>
        <rect x="436" y="6" width="32" height="3" rx="1" opacity="0.8"/>
        <rect x="474" y="6" width="46" height="3" rx="1" opacity="0.6"/>
      </g>
      <g fill="#22d3ee" font-size="8">
        <text x="0" y="32">decision</text>
        <text x="84" y="32" fill="#a78bfa">verdict</text>
        <text x="168" y="32" fill="#38bdf8">allocate</text>
        <text x="270" y="32" fill="#34d399">execution</text>
      </g>
    </g>
  </g>

  <rect x="0" y="318" width="1280" height="2" fill="#a78bfa" opacity="0.55"/>
</svg>
