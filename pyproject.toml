[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strategos"
version = "0.1.0"
description = "Agentic trading orchestrator: multi-agent ensemble, composable risk gates, regime-aware allocation, regulator-ready audit log."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "thechifura" }]
keywords = ["trading", "agents", "ensemble", "risk", "audit", "quant", "orchestrator", "rl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
llm-anthropic = ["anthropic>=0.25"]
llm-openai = ["openai>=1.30"]
llm-ollama = ["ollama>=0.2"]
all-llm = ["anthropic>=0.25", "openai>=1.30", "ollama>=0.2"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://github.com/vigilancetrent/strategos"
Repository = "https://github.com/vigilancetrent/strategos"
Issues = "https://github.com/vigilancetrent/strategos/issues"

[tool.setuptools.packages.find]
include = ["strategos*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra"
